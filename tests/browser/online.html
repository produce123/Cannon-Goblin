<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>PENDING</title></head>
<body style="margin:0">
<pre id="out" style="font:12px monospace">running…</pre>
<iframe id="fa" width="420" height="560" style="border:1px solid #999"></iframe>
<iframe id="fb" width="420" height="560" style="border:1px solid #999"></iframe>
<iframe id="fd" width="420" height="560" style="border:1px solid #999"></iframe>
<iframe id="fe" width="420" height="560" style="border:1px solid #999"></iframe>
<iframe id="ff" width="420" height="560" style="border:1px solid #999"></iframe>
<!-- 手机宽度：用来复现/防回归"棋盘被压扁导致棋子对不上交点" -->
<iframe id="fm" width="380" height="640" style="border:1px solid #999"></iframe>
<script>
// 先装错误上报，保证后面的脚本即使语法出错也能被看到。
window.onerror = (msg, src, line) => {
  fetch('/progress', { method: 'POST', body: 'HARNESS ERROR: ' + msg + ' @' + line }).catch(() => {});
};
window.onunhandledrejection = (e) => {
  fetch('/progress', { method: 'POST', body: 'HARNESS REJECTION: ' + ((e.reason && e.reason.stack) || e.reason) }).catch(() => {});
};
</script>
<script>
/*
 * 用同源 iframe 各加载一份真实 index.html，跑完整的联机流程：
 *   在线大厅 → 房主建房(6 位房间号) → 加入方输房间号(故意小写) → 双方准备界面
 *   → 房主选地图开局 → 双方走子同步 → 非当前回合防护 → 两条重开路径
 *   → 第三人抢同一房间号被拒（且不影响房内对局）
 *   → 再跑一遍强制中继模式(?transport=relay) → 本地/人机冒烟
 *
 * iframe 里的 MQTT 指向 run.mjs 自带的本地 broker，所以 E2E 不依赖公网。
 * 注意：app.js 里 gameState / playerSide / room 等是 let/const 全局词法绑定，不是 window 属性，
 * 所以跨文档读取必须走 iframe 自己的 eval。
 */
const log = [];
const out = document.getElementById('out');
const say = (m) => {
  log.push(m);
  out.textContent = log.join('\n');
  fetch('/progress', { method: 'POST', body: m }).catch(() => {});
};
const wait = (ms) => new Promise(r => setTimeout(r, ms));

const G = (win, expr) => win.eval(expr);
const boardOf = (win) => JSON.stringify(G(win, 'gameState.board'));
const turnOf = (win) => G(win, 'gameState.currentTurn');
const cell = (doc, r, c) => doc.querySelector(`#game-board .board-cell[data-r="${r}"][data-c="${c}"]`);
const isActive = (doc, id) => doc.getElementById(id).classList.contains('active');

// run.mjs 起的内置 broker 就在同一个临时服务器上。
// 加 ?public=1 则不注入 broker，改走 app 里内置的公共 broker 列表（用来验证真实链路）。
const BROKER = 'ws://' + location.host + '/mqtt';
const USE_PUBLIC_BROKERS = new URLSearchParams(location.search).has('public');
const BROKER_QUERY = USE_PUBLIC_BROKERS ? '' : 'brokers=' + encodeURIComponent(BROKER);
const CODE_RE = /^[ABCDEFGHJKMNPQRSTUVWXYZ23456789]{6}$/;

function report(ok, detail) {
  document.title = ok ? 'E2E-PASS' : 'E2E-FAIL';
  say((ok ? 'PASS: ' : 'FAIL: ') + detail);
  fetch('/result', { method: 'POST', body: JSON.stringify({ ok, detail, log }) }).catch(() => {});
}

async function ready(frame) {
  for (let i = 0; i < 240; i++) {
    const win = frame.contentWindow;
    const doc = frame.contentDocument;
    if (doc && doc.readyState === 'complete' && typeof win.enterOnline === 'function' && win.CannonRoom) {
      if (win.eval('typeof GameState') === 'function' && win.eval('typeof PRESET_MAPS') === 'object') {
        // 在 iframe 自己的 realm 里收集错误：内联 onclick 里被吞掉的 async 抛错必须能看见。
        // 同时把 alert/confirm 换成不阻塞的替身，避免无头浏览器卡在弹窗上。
        win.eval(`
          window.__errs = [];
          window.__alerts = [];
          window.alert = (m) => window.__alerts.push(String(m));
          window.confirm = () => true;
          window.addEventListener('error', (e) => window.__errs.push('error: ' + e.message));
          window.addEventListener('unhandledrejection', (e) =>
            window.__errs.push('rejection: ' + ((e.reason && e.reason.stack) || e.reason)));
        `);
        return;
      }
    }
    await wait(50);
  }
  throw new Error('iframe 未能加载出 app.js');
}

async function until(predicate, ms, label) {
  const end = Date.now() + ms;
  let i = 0;
  while (Date.now() < end) {
    let ok = false;
    try { ok = predicate(); } catch { ok = false; }
    if (ok) return;
    if (++i % 25 === 0) fetch('/progress', { method: 'POST', body: '   …仍在等待: ' + label }).catch(() => {});
    await wait(100);
  }
  throw new Error('超时: ' + label);
}

// 心跳：用来区分"父页面定时器卡住"和"某个步骤在正常等待"。
let beat = 0;
setInterval(() => {
  beat++;
  fetch('/progress', { method: 'POST', body: 'heartbeat #' + beat + ' (' + beat * 2 + 's)' }).catch(() => {});
}, 2000);

async function loadFrame(frame, query) {
  frame.src = '/index.html?' + query;
  await ready(frame);
}

/**
 * 量"棋子有没有对准网格交点"。
 *
 * 网格是画在 canvas 上的，交点在画布坐标系的 (c*cs+cs/2, r*cs+cs/2)；
 * 格子是按 px 绝对定位的 DOM。两者只有在"画布 CSS 尺寸 == 棋盘尺寸"时才重合 ——
 * 一旦棋盘被 flex 压缩，画布会跟着缩放而格子不会，棋子就会越靠边越偏。
 * 所以这里同时检查：棋盘没被压缩、画布与棋盘同尺寸、画布位图按 DPR 放大、以及
 * 每个格子中心与它对应交点的实际偏差。
 */
function measureAlignment(win, doc, boardId, w, h) {
  const board = doc.getElementById(boardId);
  const canvas = board.querySelector('.board-canvas');
  const boardRect = board.getBoundingClientRect();
  const canvasRect = canvas.getBoundingClientRect();
  const cs = win.eval('cellSize');
  const dpr = win.devicePixelRatio || 1;
  // 画布位图是 DPR 放大过的，换算回它的 CSS 像素坐标系才能算比例
  const scaleX = canvasRect.width / (canvas.width / dpr);
  const scaleY = canvasRect.height / (canvas.height / dpr);

  let maxDeviation = 0;
  let checked = 0;
  for (const cell of board.querySelectorAll('.board-cell')) {
    const r = Number(cell.dataset.r);
    const c = Number(cell.dataset.c);
    const rect = cell.getBoundingClientRect();
    const expectedX = canvasRect.left + (c * cs + cs / 2) * scaleX;
    const expectedY = canvasRect.top + (r * cs + cs / 2) * scaleY;
    maxDeviation = Math.max(
      maxDeviation,
      Math.abs(rect.left + rect.width / 2 - expectedX),
      Math.abs(rect.top + rect.height / 2 - expectedY)
    );
    checked++;
  }

  return {
    checked,
    expectedCount: w * h,
    cellSize: cs,
    dpr,
    boardWidth: boardRect.width,
    expectedBoardWidth: w * cs,
    canvasWidth: canvasRect.width,
    canvasBitmapWidth: canvas.width,
    maxDeviation
  };
}

function assertAligned(align, label) {
  if (align.checked !== align.expectedCount) {
    throw new Error(label + ' 格子数不对: ' + align.checked + ' / ' + align.expectedCount);
  }
  if (Math.abs(align.boardWidth - align.expectedBoardWidth) > 0.5) {
    throw new Error(label + ' 棋盘被压缩了：实际 ' + align.boardWidth + 'px，应为 ' +
      align.expectedBoardWidth + 'px（画布会跟着缩放、格子不会，于是棋子与网格错开）');
  }
  if (Math.abs(align.canvasWidth - align.boardWidth) > 0.5) {
    throw new Error(label + ' 画布尺寸与棋盘不一致：画布 ' + align.canvasWidth + 'px，棋盘 ' + align.boardWidth + 'px');
  }
  if (Math.abs(align.canvasBitmapWidth - align.expectedBoardWidth * align.dpr) > 1) {
    throw new Error(label + ' 画布位图没有按 DPR 放大：' + align.canvasBitmapWidth + 'px，应为 ' +
      (align.expectedBoardWidth * align.dpr) + 'px（高分屏上网格会糊）');
  }
  if (align.maxDeviation > 0.75) {
    throw new Error(label + ' 棋子与网格交点错位：最大偏差 ' + align.maxDeviation.toFixed(3) + 'px');
  }
}

async function enterOnline(frame) {
  const doc = frame.contentDocument;
  doc.querySelector('#screen-menu .menu-btn[onclick="enterOnline()"]').click();
  await until(() => isActive(doc, 'screen-online-lobby'), 5000, '进入在线大厅');
}

/** 房主建房 → 加入方用小写房间号进房 → 双方进准备界面，返回房间号。 */
async function hostAndJoin(frameA, frameB) {
  const docA = frameA.contentDocument;
  const docB = frameB.contentDocument;

  docA.querySelector('#screen-online-lobby button[onclick="createRoom()"]').click();
  await until(() => CODE_RE.test(docA.getElementById('room-code-display').textContent.trim()),
    30000, '房主生成房间号');
  const code = docA.getElementById('room-code-display').textContent.trim();

  if (docA.getElementById('lobby-actions').style.display !== 'none') throw new Error('房主端未隐藏入口按钮');
  if (docA.getElementById('room-panel').style.display !== 'block') throw new Error('房主端未显示房间号面板');
  if (G(frameA.contentWindow, 'room.code') !== code) throw new Error('房间号与 room 状态不一致');

  docB.getElementById('room-code-input').value = code.toLowerCase();   // 验证房间号归一化
  docB.querySelector('#screen-online-lobby button[onclick="joinRoom()"]').click();

  await until(() => isActive(docA, 'screen-online-ready') && isActive(docB, 'screen-online-ready'),
    45000, '双方进入准备界面');
  return code;
}

/** 从真实局面里挑一个"有合法走法"的棋子，返回 {fromR,fromC,toR,toC}。 */
function pickMove(win, side) {
  return JSON.parse(G(win, `JSON.stringify((function () {
    for (const p of gameState.getAllPiecesForSide(${side})) {
      gameState.selectPiece(p.r, p.c);
      const moves = gameState.validMoves.slice();
      gameState.deselectPiece();
      if (moves.length) return { fromR: p.r, fromC: p.c, toR: moves[0].r, toC: moves[0].c };
    }
    return null;
  })())`));
}

/** hostSide: 'cannon'（默认，房主执大炮）或 'ghost'（房主执小鬼，用来验证换边同步）。 */
async function playRound(frameA, frameB, mode, label, hostSide = 'cannon') {
  const docA = frameA.contentDocument;
  const docB = frameB.contentDocument;
  const CA = frameA.contentWindow;
  const CB = frameB.contentWindow;

  say(label + ' 1) 双方进入在线大厅…');
  await enterOnline(frameA);
  await enterOnline(frameB);

  say(label + ' 2) 房主建房，加入方输房间号进房（小写输入）…');
  const code = await hostAndJoin(frameA, frameB);
  say('   房间号 ' + code + '，双方已进入准备界面');

  if (hostSide === 'ghost') {
    say(label + ' 2.5) 房主改执小鬼方，加入方应自动换成大炮方…');
    docA.querySelector('#side-select .side-btn[data-side="ghost"]').click();
    await until(() => G(CA, 'playerSide') === 2 && G(CB, 'playerSide') === 1, 10000, '加入方收到换边');
    if (docA.getElementById('ready-role').textContent.indexOf('小鬼') === -1) {
      throw new Error(label + ' 房主准备界面没显示小鬼方: ' + docA.getElementById('ready-role').textContent);
    }
    if (docB.getElementById('ready-role').textContent.indexOf('大炮') === -1) {
      throw new Error(label + ' 加入方准备界面没跟着换成大炮方: ' + docB.getElementById('ready-role').textContent);
    }
    const selected = docA.querySelector('#side-select .side-btn.selected');
    if (!selected || selected.dataset.side !== 'ghost') throw new Error(label + ' 房主选边的选中态不对');
    say('   房主=小鬼方，加入方=大炮方（换边已同步）');
  }

  say(label + ' 3) 校验角色、界面可见性、连接方式…');
  if (G(CA, 'playerSide') !== (hostSide === 'ghost' ? 2 : 1)) {
    throw new Error(label + ' 房主执子方不对，实为 ' + G(CA, 'playerSide'));
  }
  if (G(CB, 'playerSide') !== (hostSide === 'ghost' ? 1 : 2)) {
    throw new Error(label + ' 加入方执子方不对，实为 ' + G(CB, 'playerSide'));
  }
  if (G(CA, 'room.transport') !== mode) throw new Error(label + ' 房主连接方式应为 ' + mode);
  if (G(CB, 'room.transport') !== mode) throw new Error(label + ' 加入方连接方式应为 ' + mode);

  const expectText = mode === 'p2p' ? '直连模式' : '中转模式';
  for (const [doc, who] of [[docA, '房主'], [docB, '加入方']]) {
    const meta = doc.getElementById('ready-meta').textContent;
    if (meta.indexOf(expectText) === -1) throw new Error(label + ' ' + who + ' 准备界面未显示「' + expectText + '」: ' + meta);
    if (meta.indexOf(code) === -1) throw new Error(label + ' ' + who + ' 准备界面未显示房间号: ' + meta);
  }
  if (docA.getElementById('ready-host-panel').style.display === 'none') throw new Error(label + ' 房主端未显示地图设置');
  if (docB.getElementById('ready-host-panel').style.display !== 'none') throw new Error(label + ' 加入方不该看到地图设置');
  if (docB.getElementById('ready-start-btn').style.display !== 'none') throw new Error(label + ' 加入方不该看到开始按钮');
  say('   房主可改地图和站位，加入方只能等待，连接方式 ' + expectText);

  say(label + ' 4) 房主在准备界面选第 2 张地图并开局…');
  const presetBtns = docA.querySelectorAll('#preset-maps-online .preset-map-btn');
  if (presetBtns.length !== G(CA, 'PRESET_MAPS.length')) {
    throw new Error(label + ' 准备界面预设地图数量不对: ' + presetBtns.length);
  }
  presetBtns[1].click();
  const preset1 = G(CA, 'JSON.stringify(presetToInitial(PRESET_MAPS[1]).board)');
  if (docA.getElementById('board-width-online').value !== String(G(CA, 'PRESET_MAPS[1].width'))) {
    throw new Error(label + ' 选地图后宽度输入框没跟着变');
  }
  docA.getElementById('ready-start-btn').click();

  await until(() => isActive(docA, 'screen-game') && isActive(docB, 'screen-game'), 20000, '双方进入棋盘');
  if (boardOf(CA) !== boardOf(CB)) throw new Error(label + ' 初始棋盘两端不一致');
  if (boardOf(CA) !== preset1) throw new Error(label + ' 开局棋盘不是房主选的那张地图');
  if (G(CA, 'gameMode') !== 'online' || G(CB, 'gameMode') !== 'online') throw new Error(label + ' gameMode 不是 online');
  if (G(CA, 'playerSide') !== (hostSide === 'ghost' ? 2 : 1) || G(CB, 'playerSide') !== (hostSide === 'ghost' ? 1 : 2)) {
    throw new Error(label + ' 开局后的执子方与准备界面不一致');
  }
  say('   双方开局棋盘一致，且等于房主选的地图 (' + G(CA, 'gameState.width') + '×' + G(CA, 'gameState.height') +
    ' / 大炮 ' + G(CA, 'gameState.countCannons()') + ' / 小鬼 ' + G(CA, 'gameState.countGhosts()') + ')');

  // 谁执大炮谁先走，跟房主选边无关，所以这里按 playerSide 找出双方，而不是写死房主。
  const cannonWin = G(CA, 'playerSide') === 1 ? CA : CB;
  const cannonDoc = cannonWin === CA ? docA : docB;
  const ghostWin = cannonWin === CA ? CB : CA;
  const ghostDoc = cannonWin === CA ? docB : docA;
  const cannonWho = cannonWin === CA ? '房主' : '加入方';

  say(label + ' 5) 大炮方（' + cannonWho + '）先走一手…');
  const cannonMove = pickMove(cannonWin, 1);
  if (!cannonMove) throw new Error(label + ' 找不到可走的大炮');
  const beforeCannon = boardOf(cannonWin);
  cell(cannonDoc, cannonMove.fromR, cannonMove.fromC).click();
  if (!G(cannonWin, 'gameState.selectedPiece')) throw new Error(label + ' 点击己方大炮未选中');
  cell(cannonDoc, cannonMove.toR, cannonMove.toC).click();
  await until(() => G(cannonWin, `gameState.getPiece(${cannonMove.toR},${cannonMove.toC})`) === 1 &&
    G(ghostWin, `gameState.getPiece(${cannonMove.toR},${cannonMove.toC})`) === 1 &&
    boardOf(CA) === boardOf(CB) && turnOf(CA) === 2 && turnOf(CB) === 2,
    20000, '大炮方走子同步到对手');
  if (boardOf(cannonWin) === beforeCannon) throw new Error(label + ' 大炮方本地棋盘没有变化');
  if (ghostDoc.getElementById('turn-text').textContent.indexOf('小鬼') === -1) {
    throw new Error(label + ' 小鬼方回合提示未更新: ' + ghostDoc.getElementById('turn-text').textContent);
  }
  say('   对手已重放该手，轮次交给小鬼方');

  say(label + ' 6) 小鬼方在真实棋盘上走一手…');
  const ghostMove = pickMove(ghostWin, 2);
  if (!ghostMove) throw new Error(label + ' 找不到可走的小鬼');
  cell(ghostDoc, ghostMove.fromR, ghostMove.fromC).click();
  if (!G(ghostWin, 'gameState.selectedPiece')) throw new Error(label + ' 点击小鬼未选中');
  cell(ghostDoc, ghostMove.toR, ghostMove.toC).click();
  await until(() => G(ghostWin, `gameState.getPiece(${ghostMove.toR},${ghostMove.toC})`) === 2 &&
    G(cannonWin, `gameState.getPiece(${ghostMove.toR},${ghostMove.toC})`) === 2 &&
    boardOf(CA) === boardOf(CB) && turnOf(CA) === 1 && turnOf(CB) === 1,
    20000, '小鬼方走子同步到对手');
  if (cannonDoc.getElementById('turn-text').textContent.indexOf('大炮') === -1) {
    throw new Error(label + ' 大炮方回合提示未更新: ' + cannonDoc.getElementById('turn-text').textContent);
  }
  say('   对手已重放该手，轮次交回大炮方');

  say(label + ' 7) 校验两端规则一致 + 非当前回合点不动对方棋子…');
  const capsExpr = 'gameState.getAllPiecesForSide(1).map(p => gameState.getCaptureMoves(p.r, p.c).length).join(",")';
  if (G(CA, capsExpr) !== G(CB, capsExpr)) throw new Error(label + ' 两端可用吃子数不一致');

  const ghostPiece = JSON.parse(G(ghostWin, 'JSON.stringify(gameState.getAllPiecesForSide(2)[0])'));
  const beforeWrongTurn = boardOf(ghostWin);
  cell(ghostDoc, ghostPiece.r, ghostPiece.c).click();   // 轮到大炮，小鬼方不该能选中自己的小鬼
  if (G(ghostWin, 'gameState.selectedPiece')) throw new Error(label + ' 非当前回合仍能选中棋子');
  if (boardOf(ghostWin) !== beforeWrongTurn) throw new Error(label + ' 非当前回合的点击改变了棋盘');
  say('   两端吃子数一致，非当前回合点击被正确忽略');

  return { code, preset1, cannonWin, cannonDoc, ghostWin, ghostDoc };
}

/**
 * 对手离开房间后，必须还能用同一个房间号回来。
 * （曾经房主的 _guestSid/transport 一直留着，重进只会被回 busy，人就再也进不来了。）
 */
async function rejoinRound(frameA, frameB, code, label) {
  const docA = frameA.contentDocument;
  const docB = frameB.contentDocument;
  const CA = frameA.contentWindow;
  const CB = frameB.contentWindow;

  say(label + ' 加入方点「返回」离开对局…');
  G(CB, 'backToMenu()');
  await until(() => isActive(docB, 'screen-menu') && G(CB, 'room') === null, 8000, '加入方回到主菜单');
  // 这里就是 bug 的根：房主必须解除配对，否则后面那个 join 会被回 busy
  await until(() => G(CA, 'room._guestSid') === null && G(CA, 'room.transport') === null,
    10000, '房主解除与离开者的配对');
  await until(() => docA.getElementById('game-status').textContent.indexOf('对手已离开') !== -1,
    10000, '房主收到对手离开的提示');

  say(label + ' 加入方用同一个房间号重进…');
  G(CB, 'enterOnline()');
  await until(() => isActive(docB, 'screen-online-lobby'), 5000, '加入方回到大厅');
  docB.getElementById('room-code-input').value = code.toLowerCase();   // 顺便再验证一次归一化
  docB.querySelector('#screen-online-lobby button[onclick="joinRoom()"]').click();

  await until(() => isActive(docB, 'screen-online-ready') && isActive(docA, 'screen-online-ready'),
    25000, '双方回到准备界面');
  const alerts = G(CB, '__alerts');
  if (alerts.length) throw new Error(label + ' 重进时弹了错误: ' + alerts.join(' / '));
  if (G(CA, 'room.transport') === null) throw new Error(label + ' 重进后房主没有重新配对');
  say('   双方已回到准备界面，房间号仍是 ' + code);

  say(label + ' 房主重新开局，重进后的走子仍然同步…');
  docA.getElementById('ready-start-btn').click();
  await until(() => isActive(docA, 'screen-game') && isActive(docB, 'screen-game'), 20000, '重进后重新开局');
  if (boardOf(CA) !== boardOf(CB)) throw new Error(label + ' 重进后开局棋盘不一致');

  const cannonWin = G(CA, 'playerSide') === 1 ? CA : CB;
  const cannonDoc = cannonWin === CA ? docA : docB;
  const move = pickMove(cannonWin, 1);
  if (!move) throw new Error(label + ' 重进后找不到可走的大炮');
  cell(cannonDoc, move.fromR, move.fromC).click();
  cell(cannonDoc, move.toR, move.toC).click();
  await until(() => boardOf(CA) === boardOf(CB) && turnOf(CA) === 2, 20000, '重进后的走子同步');
  say('   重进后的对局已恢复同步');
}

(async () => {
  const runtimeErrors = [];
  try {
    const A = document.getElementById('fa');
    const B = document.getElementById('fb');
    const D = document.getElementById('fd');
    const E = document.getElementById('fe');
    const F = document.getElementById('ff');

    // ---------- 直连模式：房主改执小鬼，加入方自动成大炮方 ----------
    await loadFrame(A, BROKER_QUERY);
    await loadFrame(B, BROKER_QUERY);
    const round1 = await playRound(A, B, 'p2p', '【直连】', 'ghost');

    // ---------- 重开的两条路径 ----------
    const docA = A.contentDocument;
    const docB = B.contentDocument;
    const CA = A.contentWindow;
    const CB = B.contentWindow;

    say('【直连】 8) 加入方点「再来一局」，房主应重置双方棋盘…');
    const initial = round1.preset1;
    G(CB, 'restartGame()');
    await until(() => boardOf(CA) === boardOf(CB) && boardOf(CA) === initial && turnOf(CA) === 1 && turnOf(CB) === 1,
      20000, '加入方请求重开同步');
    say('   双方已重置为房主选的初始局面（restartRequest → start 路径）');

    say('【直连】 9) 大炮方先走一手，再点「再来一局」…');
    const advance = pickMove(round1.cannonWin, 1);
    cell(round1.cannonDoc, advance.fromR, advance.fromC).click();
    cell(round1.cannonDoc, advance.toR, advance.toC).click();
    await until(() => boardOf(CA) === boardOf(CB) && turnOf(CA) === 2, 20000, '重开前先走一手');
    G(CA, 'restartGame()');
    await until(() => boardOf(CA) === boardOf(CB) && boardOf(CA) === initial && turnOf(CA) === 1, 20000, '房主直接重开同步');
    say('   双方已重置（房主直发 start 路径，房主执小鬼也能重开）');

    say('【直连】 10) 第三个页面抢同一房间号，应被拒绝且不影响房内对局…');
    await loadFrame(F, BROKER_QUERY);
    await enterOnline(F);
    const docF = F.contentDocument;
    const CF = F.contentWindow;
    docF.getElementById('room-code-input').value = round1.code;
    docF.querySelector('#screen-online-lobby button[onclick="joinRoom()"]').click();
    await until(() => G(CF, '__alerts').some((m) => m.indexOf('已经有对手') !== -1), 20000, '第三人被拒绝');
    if (G(CF, 'room') !== null) throw new Error('第三人被拒后没有清理房间状态');
    await wait(500);
    if (!isActive(docA, 'screen-game') || !isActive(docB, 'screen-game')) throw new Error('房内对局被第三人影响');
    if (boardOf(CA) !== boardOf(CB)) throw new Error('房内对局因此不同步');
    say('   第三人收到「已经有对手了」，房内对局不受影响');

    // ---------- 对手离开后还能用同一个房间号回来（直连） ----------
    say('【直连】 11) 加入方离开后，用同一个房间号重进…');
    await rejoinRound(A, B, round1.code, '【直连重进】');

    // ---------- 强制中继模式 ----------
    const relayQuery = (BROKER_QUERY ? BROKER_QUERY + '&' : '') + 'transport=relay';
    await loadFrame(D, relayQuery);
    await loadFrame(E, relayQuery);
    const round2 = await playRound(D, E, 'relay', '【中继】');

    // ---------- 中继模式下的重进（走的是 MQTT 信令，路径与直连不同） ----------
    say('【中继】 12) 加入方离开后，用同一个房间号重进…');
    await rejoinRound(D, E, round2.code, '【中继重进】');

    // ---------- 手机窄屏：棋子必须对准网格交点 ----------
    say('【手机窄屏】校验棋子与网格交点是否对齐…');
    const M = document.getElementById('fm');
    await loadFrame(M, BROKER_QUERY);
    const docM = M.contentDocument;
    const CM = M.contentWindow;

    docM.querySelector('#screen-menu .menu-btn[onclick*="local-setup"]').click();
    docM.querySelector('#screen-local-setup .start-btn').click();
    await until(() => isActive(docM, 'screen-game') && G(CM, 'gameState'), 8000, '窄屏本地对局开局');

    const gameAlign = measureAlignment(CM, docM, 'game-board', G(CM, 'gameState.width'), G(CM, 'gameState.height'));
    assertAligned(gameAlign, '窄屏对局棋盘');
    say('   对局棋盘 ' + gameAlign.boardWidth + 'px / 格子 ' + gameAlign.cellSize + 'px / DPR ' + gameAlign.dpr +
      '，最大偏差 ' + gameAlign.maxDeviation.toFixed(3) + 'px');

    G(CM, 'backToMenu()');
    await until(() => isActive(docM, 'screen-menu'), 5000, '窄屏返回菜单');
    docM.querySelector('#screen-menu .menu-btn[onclick*="local-setup"]').click();
    docM.querySelector('#screen-local-setup button[onclick="showEditor(\'local\')"]').click();
    await until(() => isActive(docM, 'screen-editor'), 5000, '窄屏进入地图编辑器');

    const editorAlign = measureAlignment(CM, docM, 'editor-board', G(CM, 'editorState.width'), G(CM, 'editorState.height'));
    assertAligned(editorAlign, '窄屏编辑器棋盘');
    say('   编辑器棋盘 ' + editorAlign.boardWidth + 'px / 格子 ' + editorAlign.cellSize + 'px，最大偏差 ' +
      editorAlign.maxDeviation.toFixed(3) + 'px');

    // ---------- 本地 / 人机冒烟 ----------
    say('【本地/人机】 11) 冒烟测试…');
    F.contentWindow.eval('leaveOnline()');
    await until(() => isActive(docF, 'screen-menu'), 5000, '返回主菜单');

    docF.querySelector('#screen-menu .menu-btn[onclick*="local-setup"]').click();
    docF.querySelector('#screen-local-setup .start-btn').click();
    await until(() => isActive(docF, 'screen-game') && G(CF, 'gameState'), 8000, '本地对局开局');
    const localMove = pickMove(CF, 1);
    cell(docF, localMove.fromR, localMove.fromC).click();
    cell(docF, localMove.toR, localMove.toC).click();
    if (G(CF, 'gameState.currentTurn') !== 2) throw new Error('本地对局走子后轮次不对: ' + G(CF, 'gameState.currentTurn'));
    say('   本地对局可开局、可走子');

    docF.querySelector('#screen-menu .menu-btn[onclick*="ai-setup"]').click();
    await until(() => isActive(docF, 'screen-ai-setup'), 5000, '进入人机设置界面');
    say('   人机默认地图：大炮 ' + G(CF, 'PRESET_MAPS[selectedPreset.ai].cannons.length') +
      ' 门 / 小鬼 ' + G(CF, 'PRESET_MAPS[selectedPreset.ai].ghosts.length') + ' 只');

    // 三种难度都要真的在浏览器里出招：深度 1/2/4 的搜索不能报错、不能把界面卡住
    for (const difficulty of ['easy', 'normal', 'hard']) {
      docF.querySelector('#screen-menu .menu-btn[onclick*="ai-setup"]').click();
      await until(() => isActive(docF, 'screen-ai-setup'), 5000, difficulty + ' 进入人机设置界面');
      docF.getElementById('diff-' + difficulty).click();
      if (G(CF, 'aiDifficulty') !== difficulty) throw new Error('难度没切到 ' + difficulty);
      docF.querySelector('#screen-ai-setup .start-btn').click();
      await until(() => isActive(docF, 'screen-game') && G(CF, 'gameState'), 8000, difficulty + ' 人机开局');

      const mySide = G(CF, 'playerSide');
      await until(() => G(CF, 'gameState.currentTurn') === mySide, 20000, difficulty + ' 轮到我走');
      const myMove = pickMove(CF, mySide);
      if (!myMove) throw new Error(difficulty + ' 找不到我方棋子');
      cell(docF, myMove.fromR, myMove.fromC).click();
      cell(docF, myMove.toR, myMove.toC).click();
      const afterMine = boardOf(CF);

      const startedAt = Date.now();
      await until(() => G(CF, 'gameState.currentTurn') === mySide && boardOf(CF) !== afterMine,
        20000, difficulty + ' 人机应当回走一手');
      say('   ' + difficulty + ' 人机已回走（' + (Date.now() - startedAt) + 'ms，含 400ms 出招延时）');

      G(CF, 'backToMenu()');
      await until(() => isActive(docF, 'screen-menu'), 5000, difficulty + ' 返回菜单');
    }

    say('12) 收集各页面里被吞掉的异常…');
    if (runtimeErrors.length) throw new Error('页面运行时报错: ' + runtimeErrors.join(' | '));
    for (const [frame, who] of [[A, '直连房主'], [B, '直连加入方'], [D, '中继房主'], [E, '中继加入方'], [F, '本地/人机']]) {
      const errs = G(frame.contentWindow, 'window.__errs.join(" | ")');
      if (errs) throw new Error(who + ' 页面内异常: ' + errs);
    }

    report(true, '完整联机流程通过：房间号 ' + round1.code +
      ' → 双方准备界面 → 房主选地图开局 → 双方走子一致（直连模式 + 强制中继模式各一遍）');
  } catch (e) {
    // 失败时把各 iframe 里被吞掉的 alert / 异常一起带出来，否则只能看到一句"超时"。
    let extra = '';
    for (const [id, who] of [['fa', '页A'], ['fb', '页B'], ['fd', '页D'], ['fe', '页E'], ['ff', '页F']]) {
      try {
        const win = document.getElementById(id).contentWindow;
        const alerts = win.__alerts || [];
        const errs = win.__errs || [];
        if (alerts.length) extra += '\n' + who + ' alert: ' + alerts.join(' | ');
        if (errs.length) extra += '\n' + who + ' err: ' + errs.join(' | ');
        extra += '\n' + who + ' state: screen=' + win.eval('currentScreen') +
          ' room=' + win.eval('room ? room.transport || "未定" : "无"');
      } catch { /* 该页还没起来 */ }
    }
    report(false, ((e && e.stack) || String(e)) + extra);
  }
})();
</script>
</body>
</html>
