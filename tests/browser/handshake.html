<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>PENDING</title></head>
<body style="margin:0">
<pre id="out" style="font:12px monospace">running…</pre>
<iframe id="fa" width="480" height="620" style="border:1px solid #999"></iframe>
<iframe id="fb" width="480" height="620" style="border:1px solid #999"></iframe>
<iframe id="fc" width="480" height="620" style="border:1px solid #999"></iframe>
<script>
// 先装错误上报，保证后面的脚本即使语法出错也能被看到。
window.onerror = (msg, src, line) => {
  fetch('/progress', { method: 'POST', body: 'HARNESS ERROR: ' + msg + ' @' + line }).catch(() => {});
};
window.onunhandledrejection = (e) => {
  fetch('/progress', { method: 'POST', body: 'HARNESS REJECTION: ' + ((e.reason && e.reason.stack) || e.reason) }).catch(() => {});
};
</script>
<script>
// 用两个同源 iframe 各加载一份真实 index.html，完整跑一遍联机 UI 流程。
// 注意：app.js 里 gameState / playerSide 等是 let/const 全局词法绑定，不是 window 属性，
// 所以跨文档读取必须走 iframe 自己的 eval。
const log = [];
const out = document.getElementById('out');
const say = (m) => {
  log.push(m);
  out.textContent = log.join('\n');
  fetch('/progress', { method: 'POST', body: m }).catch(() => {});
};
const wait = (ms) => new Promise(r => setTimeout(r, ms));

// 在 iframe 自己的 realm 里求值，才能看到全局词法绑定。
const G = (win, expr) => win.eval(expr);
const boardOf = (win) => JSON.stringify(G(win, 'gameState.board'));
const turnOf = (win) => G(win, 'gameState.currentTurn');

function report(ok, detail) {
  document.title = ok ? 'E2E-PASS' : 'E2E-FAIL';
  say((ok ? 'PASS: ' : 'FAIL: ') + detail);
  fetch('/result', { method: 'POST', body: JSON.stringify({ ok, detail, log }) }).catch(() => {});
}

async function ready(frame) {
  for (let i = 0; i < 200; i++) {
    const win = frame.contentWindow;
    const doc = frame.contentDocument;
    if (doc && doc.readyState === 'complete' && win.createRoom && win.CannonWebRTC) {
      if (win.eval('typeof GameState') === 'function' && win.eval('typeof PRESET_MAPS') === 'object') {
        // 在 iframe 自己的 realm 里收集错误：内联 onclick 里被吞掉的 async 抛错必须能看见。
        win.eval(`
          window.__errs = [];
          window.addEventListener('error', (e) => window.__errs.push('error: ' + e.message));
          window.addEventListener('unhandledrejection', (e) =>
            window.__errs.push('rejection: ' + ((e.reason && e.reason.stack) || e.reason)));
        `);
        return;
      }
    }
    await wait(50);
  }
  throw new Error('iframe 未能加载出 app.js');
}

async function until(predicate, ms, label) {
  const end = Date.now() + ms;
  let i = 0;
  while (Date.now() < end) {
    let ok = false;
    try { ok = predicate(); } catch { ok = false; }
    if (ok) return;
    if (++i % 20 === 0) fetch('/progress', { method: 'POST', body: '   …仍在等待: ' + label }).catch(() => {});
    await wait(100);
  }
  throw new Error('超时: ' + label);
}

// 心跳：用来区分"父页面定时器卡住"和"某个步骤在正常等待"。
let beat = 0;
setInterval(() => {
  beat++;
  fetch('/progress', { method: 'POST', body: 'heartbeat #' + beat + ' (' + beat * 2 + 's)' }).catch(() => {});
}, 2000);

const cell = (doc, r, c) => doc.querySelector(`#game-board .board-cell[data-r="${r}"][data-c="${c}"]`);
const isActive = (doc) => doc.getElementById('screen-game').classList.contains('active');

(async () => {
  const runtimeErrors = [];
  try {
    const A = document.getElementById('fa');
    const B = document.getElementById('fb');

    A.src = '/index.html';
    B.src = '/index.html';
    await ready(A);
    await ready(B);
    A.contentWindow.addEventListener('error', (e) => runtimeErrors.push('A: ' + e.message));
    B.contentWindow.addEventListener('error', (e) => runtimeErrors.push('B: ' + e.message));

    const docA = A.contentDocument;
    const docB = B.contentDocument;
    const CA = A.contentWindow;
    const CB = B.contentWindow;

    say('1) 双方进入联机大厅，检查预设地图下拉…');
    docA.querySelector('#screen-menu .menu-btn[onclick*="online-lobby"]').click();
    docB.querySelector('#screen-menu .menu-btn[onclick*="online-lobby"]').click();
    const presetCount = G(CA, 'PRESET_MAPS.length');
    if (docA.getElementById('online-preset').options.length !== presetCount) {
      throw new Error('房主端预设地图下拉未填充');
    }

    say('2) 房主点「生成邀请码」…');
    docA.querySelector('#screen-online-lobby button[onclick="createRoom()"]').click();
    await until(() => docA.getElementById('relay-output').value.startsWith('CG1.'), 30000, '生成邀请码');
    const offer = docA.getElementById('relay-output').value;
    if (docA.getElementById('answer-panel').style.display !== 'block') throw new Error('房主端未出现应答码输入框');
    say('   邀请码 ' + offer.length + ' 字符；大厅已切换为转发面板');

    say('3) 加入方粘贴邀请码，点「生成应答码」…');
    docB.getElementById('offer-input').value = offer;
    docB.querySelector('#screen-online-lobby button[onclick="joinRoom()"]').click();
    await until(() => docB.getElementById('relay-output').value.startsWith('CG1.'), 30000, '生成应答码');
    const answer = docB.getElementById('relay-output').value;
    say('   应答码 ' + answer.length + ' 字符');

    say('4) 房主粘贴应答码，点「连接对手」…');
    docA.getElementById('answer-input').value = answer;
    docA.querySelector('#screen-online-lobby button[onclick="finishConnection()"]').click();

    say('5) 等待双方自动进入棋盘…');
    await until(() => isActive(docA) && isActive(docB), 30000, '双方进入棋盘');

    if (G(CA, 'playerSide') !== 1) throw new Error('房主应为大炮方，实为 ' + G(CA, 'playerSide'));
    if (G(CB, 'playerSide') !== 2) throw new Error('加入方应为小鬼方，实为 ' + G(CB, 'playerSide'));
    if (G(CA, 'gameMode') !== 'online') throw new Error('房主 gameMode 不是 online');
    if (G(CA, 'gameState.width') !== 6 || G(CA, 'gameState.height') !== 6) throw new Error('初始棋盘尺寸不对');
    if (boardOf(CA) !== boardOf(CB)) throw new Error('初始棋盘两端不一致');
    say('   房主=大炮方，加入方=小鬼方，初始棋盘一致 (6×6 / ' + G(CA, 'gameState.countGhosts()') + ' 鬼)');

    say('6) 房主在真实棋盘上点棋子走一手（大炮 (5,2)->(4,2)）…');
    const before = boardOf(CA);
    cell(docA, 5, 2).click();
    if (!G(CA, 'gameState.selectedPiece')) throw new Error('点击己方大炮未选中');
    if (G(CA, 'gameState.validMoves').length !== 2) throw new Error('大炮可选走法数应为 2，实为 ' + G(CA, 'gameState.validMoves').length);
    cell(docA, 4, 2).click();
    // 走完轮到小鬼方（2），两端都必须变成同一局面
    await until(() => G(CA, 'gameState.getPiece(5,2)') === 0 && G(CB, 'gameState.getPiece(4,2)') === 1 &&
      boardOf(CA) === boardOf(CB) && turnOf(CA) === 2 && turnOf(CB) === 2, 15000, '房主走子同步到加入方');
    if (boardOf(CA) === before) throw new Error('房主本地棋盘没有发生变化');
    if (docB.getElementById('turn-text').textContent.indexOf('小鬼') === -1) throw new Error('加入方回合提示未更新: ' + docB.getElementById('turn-text').textContent);
    say('   加入方已重放该手，轮次交给小鬼方');

    say('7) 加入方在真实棋盘上走一手小鬼（(2,0)->(3,0)）…');
    cell(docB, 2, 0).click();
    if (!G(CB, 'gameState.selectedPiece')) throw new Error('加入方点击小鬼未选中');
    cell(docB, 3, 0).click();
    await until(() => G(CB, 'gameState.getPiece(2,0)') === 0 && G(CA, 'gameState.getPiece(3,0)') === 2 &&
      boardOf(CA) === boardOf(CB) && turnOf(CA) === 1 && turnOf(CB) === 1, 15000, '加入方走子同步到房主');
    if (docA.getElementById('turn-text').textContent.indexOf('大炮') === -1) throw new Error('房主回合提示未更新: ' + docA.getElementById('turn-text').textContent);
    say('   房主已重放该手，轮次交回大炮方');

    const lastMove = G(CA, 'gameState.lastMove');
    if (!lastMove || lastMove.toR !== 3 || lastMove.toC !== 0) throw new Error('房主端最后一步数据不对');

    say('8) 检查两端可用吃子一致…');
    const capsExpr = 'gameState.getAllPiecesForSide(1).map(p => gameState.getCaptureMoves(p.r, p.c).length).join(",")';
    const capsA = G(CA, capsExpr);
    const capsB = G(CB, capsExpr);
    if (capsA !== capsB) throw new Error('两端可用吃子数不一致: ' + capsA + ' vs ' + capsB);

    say('9) 检查双方都点不动对方的棋子…');
    const beforeWrongTurn = boardOf(CB);
    cell(docB, 4, 2).click();        // 这是房主的大炮，加入方不该能选中
    if (G(CB, 'gameState.selectedPiece')) throw new Error('加入方选中了对手的棋子');
    if (boardOf(CB) !== beforeWrongTurn) throw new Error('非当前回合的点击改变了棋盘');

    say('10) 加入方点「再来一局」，房主应重置双方棋盘…');
    const initialBoard = JSON.stringify(G(CA, 'presetToInitial(PRESET_MAPS[0]).board'));
    G(CB, 'restartGame()');
    await until(() => boardOf(CA) === boardOf(CB) && boardOf(CA) === initialBoard &&
      G(CA, 'gameState.getPiece(5,2)') === 1 && turnOf(CA) === 1 && turnOf(CB) === 1, 15000, '加入方请求重开同步');
    say('   双方棋盘已重置为初始局面（走 restartRequest 转 restart 路径）');

    say('11) 房主点「再来一局」，也应重置双方棋盘…');
    cell(docA, 5, 2).click();
    cell(docA, 4, 2).click();
    await until(() => boardOf(CA) === boardOf(CB) && turnOf(CA) === 2, 15000, '重开前先走一手');
    G(CA, 'restartGame()');
    await until(() => boardOf(CA) === boardOf(CB) && boardOf(CA) === initialBoard && turnOf(CA) === 1, 15000, '房主直接重开同步');
    say('   双方棋盘已重置（走 restart 直发路径）');

    say('12) 本地 / 人机对局冒烟测试…');
    const C = document.getElementById('fc');
    C.src = '/index.html';
    await ready(C);
    const docC = C.contentDocument;
    const CC = C.contentWindow;

    docC.querySelector('#screen-menu .menu-btn[onclick*="local-setup"]').click();
    docC.querySelector('#screen-local-setup .start-btn').click();
    await until(() => isActive(docC), 5000, '本地对局开局');
    cell(docC, 5, 2).click();
    cell(docC, 4, 2).click();
    if (G(CC, 'gameState.currentTurn') !== 2) throw new Error('本地对局走子后轮次不对: ' + G(CC, 'gameState.currentTurn'));
    say('   本地对局可开局、可走子');

    docC.querySelector('#screen-menu .menu-btn[onclick*="ai-setup"]').click();
    docC.querySelector('#screen-ai-setup .start-btn').click();
    await until(() => isActive(docC) && G(CC, 'gameState.countCannons()') > 0, 5000, '人机对局开局');
    say('   人机对局可开局（大炮 ' + G(CC, 'gameState.countCannons()') + ' 门 / 小鬼 ' + G(CC, 'gameState.countGhosts()') + ' 只）');

    const errsC = G(CC, 'window.__errs.join(" | ")');
    if (errsC) throw new Error('本地/人机页面异常: ' + errsC);

    if (runtimeErrors.length) throw new Error('页面运行时报错: ' + runtimeErrors.join(' | '));

    const errsA = G(CA, 'window.__errs.join(" | ")');
    const errsB = G(CB, 'window.__errs.join(" | ")');
    if (errsA || errsB) throw new Error('页面内出现异常 → 房主[' + errsA + '] 加入方[' + errsB + ']');

    report(true, '完整 UI 流程通过：邀请码 ' + offer.length + ' → 应答码 ' + answer.length +
      ' → 自动开局 → 双方各走一手且局面一致');
  } catch (e) {
    report(false, (e && e.stack) || String(e));
  }
})();
</script>
</body>
</html>
